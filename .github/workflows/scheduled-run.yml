name: scheduled-run

# The Monday run at 08:30 Jerusalem time, and the same run on demand (demos, the recording,
# re-runs). GitHub schedules are in UTC and Israel changes clocks, so there are two Monday
# entries; the gate job lets through only the one that is 08:xx in Asia/Jerusalem.
# The run captures public pages and commits what it found. With the Sheet secret and
# variable set, the live step also reads the own-pricing tab and appends the rows to Maya's
# Sheet; without them it writes the CSV only. They are given to that one step, nothing else.
# With the Slack secret set, the live step also posts the run's one line to #leadership;
# without it the line is only stored with the result.
# With the Base44 secret and variable set, the publish step uploads the live page (this run's
# items, skipped signals, run history and Slack line) to the Base44 app as a static site;
# without them it only writes runs/result.html. The secret is given to that one step.

on:
  schedule:
    - cron: "30 5 * * 1"
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      headless:
        description: "Run Chrome headless instead of with a window on a virtual display"
        type: boolean
        default: false

permissions:
  contents: read

# Two runs never race on the snapshots or the run log: a second one waits for the first.
concurrency:
  group: scheduled-run
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/schedule-gate.ts
            src/schedule
            src/config
            package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/schedule-gate.ts

  run:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # The branch by name, not the commit that triggered the run: a run that waited in the
      # concurrency group must start from what the run before it committed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Google Chrome
        run: npx playwright-core install --with-deps --force chrome
      - id: live
        name: Live run
        continue-on-error: true
        env:
          HEADLESS: ${{ inputs.headless && '--headless' || '' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Where the Slack line links; empty means the audience's sheet. Set to the live page once it exists.
          DETAILS_URL: ${{ vars.DETAILS_URL }}
        # The last run's committed result goes first, so a crash cannot pass it off as this run's.
        run: |
          rm -f runs/result.json runs/result.csv runs/result.html
          xvfb-run --auto-servernum ./run --live --output runs/result.json $HEADLESS
      # The page goes public, so the outputs are checked first; the page is published only if they pass.
      - id: precheck
        name: No forbidden marker in the snapshots or the result before the page goes up
        if: ${{ !cancelled() }}
        run: npm run repo-check
      # Before the run log, so a failed publish is in result.json's errors and in this run's log line.
      - id: page
        name: Publish the live page
        if: ${{ !cancelled() && steps.precheck.outcome == 'success' }}
        continue-on-error: true
        env:
          STARTED_AT: ${{ steps.start.outputs.at }}
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
          BASE44_APP_ID: ${{ vars.BASE44_APP_ID }}
        run: npx tsx scripts/publish-page.ts "$STARTED_AT" runs/result.json snapshots runs/run-log.jsonl runs/result.html
      - id: log
        name: Append to the run log
        if: ${{ !cancelled() }}
        env:
          STARTED_AT: ${{ steps.start.outputs.at }}
        run: npx tsx scripts/append-run-log.ts "$STARTED_AT" runs/result.json snapshots runs/run-log.jsonl
      # A forbidden marker in a page fails the job and nothing is committed, the run log line included.
      - name: No forbidden marker in anything about to be committed
        run: npm run repo-check
      # A bot push starts no CI, so this run is the only check its commit gets: if the new
      # snapshots or run log line would leave the branch failing `npm test`, nothing is committed.
      - name: npm test passes with what is about to be committed
        run: npm test
      - name: Commit the snapshots, the result, its CSV, the page and the run log
        env:
          MESSAGE: "${{ github.event_name }} run at ${{ steps.start.outputs.at }}: ${{ steps.log.outputs.summary }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots runs
          git commit -m "$MESSAGE"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
      - name: Fail if the live run itself failed
        if: steps.live.outcome == 'failure'
        run: exit 1
