name: proof

on:
  push:
  pull_request:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: The brief's command on the brief's example
        run: ./run --input cases/brief-example/input.json --output result.json
